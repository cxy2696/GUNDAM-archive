name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate content
        run: pnpm validate
      - name: Typecheck
        run: pnpm typecheck
      - name: Build static site
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://gaia-archive.example
