name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Validate content
        run: pnpm validate
      - name: Check documentation links
        run: pnpm docs:check
      - name: Check editorial language
        run: pnpm language:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Build static site
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: https://cxy2696.github.io/GUNDAM-archive
      - name: Audit internal links and fragments
        run: pnpm links:check
      - name: Audit every exported route
        run: pnpm routes:check
